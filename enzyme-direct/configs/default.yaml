seed: 7
# CARE is used only as an exclusion list: no protein from any CARE Task 1 test split may appear
# in these benchmarks (by accession or by exact sequence). CARE's training split is not excluded:
# neither model was trained on it, and excluding it leaves too few EC 5/6 families (CARE already
# holds almost every Swiss-Prot enzyme created before 2024).
care:
  raw_base: https://raw.githubusercontent.com/jsunn-y/CARE
  commit: e570c36300bce1dd345bb726612784e518aae6b9
  files:
  - splits/task1/30_protein_test.csv
  - splits/task1/30-50_protein_test.csv
  - splits/task1/price_protein_test.csv
  - splits/task1/promiscuous_protein_test.csv
# Accepted EC names for the ec4 answer options (frozen into benchmarks/ec4_labels.tsv).
enzyme_db: https://ftp.expasy.org/databases/enzyme/enzyme.dat
uniprot:
  # Recent Swiss-Prot entries only, to lower the chance that a model saw the sequence together
  # with its annotation during pre-training.
  created_after: '2018-01-01'
  min_len: 80
  max_len: 600          # at most ~560 Laya tokens, so max_len 1024 below never truncates
mmseqs:
  release: 17-b804f
  # One protein per sequence cluster, so no two benchmark proteins are close homologs.
  cluster_min_seq_id: 0.3
  cluster_coverage: 0.8
stages:
  ec1:
    per_class: 35      # EC 6 has 39 distinct 30%-identity families
    classes: ['1', '2', '3', '4', '5', '6']
  ec4:
    n_ecs: 15               # at most; every EC with >= per_ec distinct families is used
    per_ec: 10              # 11 ECs qualify with the settings above
    cluster_min_seq_id: 0.5 # proteins of one EC share a family more often; 50% instead of 30%
# Pre-registered gate for running the harder ec4 benchmark with a model: on ec1 its accuracy's
# 95% Wilson lower bound must exceed chance + 10 points and the one-sided exact binomial test
# against chance must give p < 0.001.
gate:
  margin_over_chance: 0.10
  alpha: 0.001
models:
  jev:
    endpoint: https://api.typesafe.ai/v1/systemone
    model: jev-1.13.0
  # Laya's default 512-token window cuts the end off sequences over ~500 residues; 1024 fits them
  # all. The English checkpoint was trained at 512, so it runs beyond its training length here.
  laya-english:
    router_model: english
    max_len: 1024
  laya-multilingual:
    router_model: multilingual
    max_len: 1024
# ---------------------------------------------------------------- context ladder (ec1 only)
# Jev gets the sequence plus context computed from it (src/ed/features.py):
#   level 1: physico-chemical properties + amino-acid composition
#   level 2: level 1 + matches to 14 fixed textbook motifs (list fixed before any context run)
# Each level has a matched control: logistic regression on exactly the same information, trained
# on Swiss-Prot pool proteins (same filters as the benchmarks) that share no 30%-identity family
# with ec1 and are not in ec4. Nearest neighbour against CARE's training set (Swiss-Prot enzymes,
# benchmark proteins removed) is the practical ceiling for sequence tools.
context:
  levels: [1, 2]
controls:
  logreg: {C: 1.0, max_iter: 5000}   # standardised features, class-balanced weights, not tuned
  nn_reference: splits/task1/protein_train.csv
  nn_sensitivity: 7.5
# Pre-registered reading (fixed before any context run):
#  - Jev "uses the context" at a level if it passes the gate above at that level.
#  - Jev "adds to the context" if it beats that level's logistic-regression control, paired exact
#    McNemar test p < 0.05 (two-sided) with Jev ahead.
# ---------------------------------------------------------------- homolog evidence (ec1 only)
# The enzyme-evidence setup on this benchmark: MMseqs2 search against CARE's training set with
# the benchmark proteins removed (same parameters as enzyme-evidence), top-k hits -> one candidate
# per exact EC with identity, coverage, rank and support; Jev chooses among them (or 'none').
# Scored at level 1 (class of the chosen EC) and level 4 (exact EC). Proteins without a hit get
# no prediction from any hit-based method (scored wrong).
homologs:
  sensitivity: 7.5
  max_seqs: 1000
  evalue: 0.001
  top_k_hits: 10
  max_candidates: 10
# Pre-registered reading (fixed before the run): Jev "adds to homolog evidence" if its level-1
# accuracy beats the nearest neighbour from the same search (paired exact McNemar p < 0.05, Jev
# ahead). Level 4 is reported the same way as a secondary result. A hybrid that uses Jev's
# level-2 (motif) answer for proteins without a hit is reported as secondary as well.
# ---------------------------------------------------------------- ESM-2 (ec1 only)
# A protein language model as the fair sequence-only reference. Mean-pooled last-layer
# embeddings of facebook/esm2_t33_650M_UR50D, computed on CPU.
# Training set: CARE training proteins (benchmark removed) with one complete EC in classes 1-6,
# 80-600 residues, and NOT among the MMseqs2 hits (e <= 1e-3, the homologs search above) of any
# ec1 protein, so no detectable homolog of a test protein is used; seeded draw of per_class each.
#   esm-probe          logistic regression on the embeddings (standardised, class-balanced, C=1)
#   esm-knn            class of the nearest training protein by cosine similarity of embeddings
#   logreg-ctx1-care   logistic regression on the level-1 features, same training set (control)
#   hybrid-nn-esm      nearest neighbour when its best hit has >= 30% identity, else esm-probe
# "Hard" subset: ec1 proteins with no MMseqs2 hit or a best hit below 30% identity.
esm:
  model: facebook/esm2_t33_650M_UR50D
  per_class: 500
  hard_identity: 0.3
# Pre-registered reading (fixed before the run):
#  - ESM-2 reads function from sequence if esm-probe passes the gate on ec1.
#  - ESM-2 helps where homology search is weak if, on the hard subset, esm-probe beats
#    nn-homologs (paired exact McNemar p < 0.05, esm ahead).
#  - Secondary: hybrid-nn-esm vs nn-homologs on all 210 proteins, same test.
#  - Any later fine-tuned Laya must beat esm-probe on ec1 to be worth reporting as useful.
# ---------------------------------------------------------------- embedding neighbours, exact EC
# Precomputed ProtT5 per-protein embeddings for all of Swiss-Prot, published by UniProt (no GPU
# needed; ProtT5 replaces ESM-2 here because its embeddings exist for the whole reference).
# Reference: CARE's training set with every benchmark protein removed (as for the MMseqs2 search).
# Queries: ec1 (210) and ec4 (110) together. Scored at the exact EC (level 4) and at level 1.
#   mmseqs-nn   EC of the best MMseqs2 hit (same search as the homologs section)
#   emb-nn      EC of the reference protein with the highest cosine similarity of embeddings
#   hybrid      mmseqs-nn, and emb-nn for proteins without any MMseqs2 hit
# (a neighbour with several ECs contributes the first in sort order, for both methods)
embeddings:
  url: https://ftp.uniprot.org/pub/databases/uniprot/current_release/knowledgebase/embeddings/uniprot_sprot/per-protein.h5
  file: raw/sprot_prott5_per_protein.h5
# Pre-registered reading (fixed before the run):
#  - Primary: hybrid beats mmseqs-nn at the exact EC on ec1+ec4 (paired exact McNemar p < 0.05,
#    hybrid ahead). Its gain can only come from proteins without a hit.
#  - Secondary: emb-nn vs mmseqs-nn at the exact EC on all 320 proteins, same test.
#  - Descriptive: accuracy by subset (no hit / best hit < 30% / >= 30% identity).
